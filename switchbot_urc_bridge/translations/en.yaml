configuration:
  adapter:
    name: "Bluetooth adapter"
    description: "Enter the Bluetooth address of the dedicated USB dongle, for example 02:11:22:33:44:55."
  device_key:
    name: "Bridge device key"
    description: "Enter a private key of 32 hexadecimal characters, using only 0–9 and a–f. Enter the same key in Remote Studio. Keep your existing key if you already have working remotes."
  addresses:
    name: "Addresses (optional)"
    description: "Leave empty for automatic allocation. To prioritize addresses, enter a comma-separated list, for example C0:12:34:56:78:90, C1:12:34:56:78:90."
  remote_address:
    name: "Universal Remote address (optional)"
    description: "Leave empty for normal use. For diagnostics, enter the Bluetooth address of the physical remote, for example 02:66:77:88:99:AA."
  mqtt_topic:
    name: "MQTT button topic"
    description: "Keep switchbot_urc/button for use with Remote Studio."
  discovery:
    name: "MQTT discovery"
    description: "Keep enabled to create the MQTT button event entity and device triggers in Home Assistant."
  hci_trace:
    name: "Bluetooth trace logging"
    description: "Leave off for normal use. Enable temporarily when investigating a Bluetooth connection problem."
  conn_interval_min_ms:
    name: "Minimum connection interval"
    description: "Enter a number in milliseconds. The default is 7.5."
  conn_interval_max_ms:
    name: "Maximum connection interval"
    description: "Enter a number in milliseconds. The default is 15.0."
