name: SwitchBot URC Bridge
version: "0.53.6"
slug: switchbot_urc_bridge
description: >-
  Use your SwitchBot Universal Remote to control lights, scenes, and scripts in Home Assistant.
url: https://github.com/batareya16/switchbot-urc-addon
arch:
  - aarch64
  - amd64
  - armv7
  - armhf
startup: application
boot: manual

# Let the base image's s6-overlay be PID 1 (required by the modern HA base images); otherwise
# Supervisor injects its own init and s6 fails with "can only run as pid 1".
init: false
host_network: true
privileged:
  - NET_ADMIN
  - NET_RAW
udev: true
services:
  - mqtt:want
options:
  adapter: hci1
  addresses: ""
  remote_address: ""
  mqtt_topic: switchbot_urc/button
  discovery: true
  hci_trace: false
  conn_interval_min_ms: 7.5
  conn_interval_max_ms: 15.0
schema:
  adapter: str
  addresses: str?
  remote_address: str
  mqtt_topic: str
  discovery: bool
  hci_trace: bool
  conn_interval_min_ms: float?
  conn_interval_max_ms: float?
